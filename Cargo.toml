[workspace]
resolver = "2"
members = ["crates/bloxcode-core", "crates/bloxcode-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"
repository = "https://github.com/itriedcoding/BloxCode"
authors = ["BloxCode"]

[workspace.dependencies]
anyhow = "1.0.93"
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
ureq = { version = "2.10.1", features = ["json"] }
tiny_http = "0.12.0"
dirs = "5.0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
