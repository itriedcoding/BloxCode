[package]
name = "bloxcode-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "BloxCode — AI game studio for Roblox"

[[bin]]
name = "bloxcode"
path = "src/main.rs"

[dependencies]
bloxcode-core = { path = "../bloxcode-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts"] }
egui = "=0.29.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Console"] }

[build-dependencies]
embed-resource = "2.4"

[features]
default = []
